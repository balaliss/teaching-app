services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teaching
      POSTGRES_PASSWORD: teaching
      POSTGRES_DB: teaching_app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teaching -d teaching_app']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://teaching:teaching@db:5432/teaching_app?schema=public
      STORAGE_DRIVER: disk
      STORAGE_DISK_PATH: /data/uploads
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data/uploads
    profiles:
      - full

volumes:
  pgdata:
  uploads:
